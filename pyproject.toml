[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sarbar"
version = "0.5.3"
description = "CAST — Container Automated Security Testing: orchestrator + policy + report over existing scanners"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sarbar" }]
keywords = ["security", "container", "docker", "sast", "sarif", "policy-as-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# No required runtime dependencies: sarbar must work air-gapped.
# PyYAML is optional because policy.py embeds the profile table.
dependencies = []

[project.urls]
Homepage = "https://github.com/doisss/cast"
Repository = "https://github.com/doisss/cast.git"
Issues = "https://github.com/doisss/cast/issues"

[project.optional-dependencies]
report = ["rich>=13.0"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7", "pytest-cov>=4", "rich>=13.0", "PyYAML>=6.0"]

[project.scripts]
sarbar = "sarbar.cli:main"
cast = "sarbar.cli:main"

[tool.setuptools.packages.find]
include = ["sarbar*"]

[tool.setuptools.package-data]
sarbar = ["policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"