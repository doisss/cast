name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install pyflakes
          # A typo in a path would silently disable a check, which in a
          # security tool means a green build that verified nothing. So the
          # absence of unused names is enforced, not assumed.
          pyflakes sarbar tests

      - name: Test
        run: pytest -q

      - name: The installer must be syntactically valid
        run: bash -n install.sh && bash -n uninstall.sh